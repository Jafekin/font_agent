[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "font"
version = "0.1.0"
description = "Ancient script OCR service with RAG-enhanced analysis."
readme = "README.md"
requires-python = "==3.12.8"
license = { text = "Proprietary" }
authors = [
  { name = "Jafekin" }
]
dependencies = [
  "Django==4.2.7",
  "django-cors-headers==4.3.1",
  "numpy==2.2.6",
  "openai==2.6.1",
  "pillow==12.0.0",
  "python-dotenv==1.0.0",
  "requests==2.32.5",
  "torch==2.9.0",
  "tqdm>=4.65.0",
  "six==1.17.0",
  "timm==1.0.22",
  "torchvision==0.24.0",
  "rdflib==6.3.2",
  "transformers>=4.35.0",
  "sentence-transformers>=2.2.0",
  "neo4j>=5.0.0",
  "pymilvus>=2.3.0",
  "elasticsearch>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["app", "config", "rag", "scripts", "ocr", "chat", "model"]

[tool.setuptools.package-data]
"app" = ["templates/**/*.html"]
"rag" = ["index/**/*"]

